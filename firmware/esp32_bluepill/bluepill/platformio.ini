[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200

; Flashing via USB-TTL adapter (UART bootloader).
; Wiring: adapter TX -> PA10, adapter RX -> PA9, GND -> GND.
; DISCONNECT the ESP32 from PA9/PA10 before flashing.
; Set BOOT0 jumper to 1 and press Reset to enter bootloader mode.
; Set BOOT0 back to 0 and press Reset again after flashing.
upload_protocol = serial
upload_port = /dev/ttyUSB0
upload_speed = 57600

; Keep stlink as debug_tool (no-op without hardware, harmless).
debug_tool = stlink

; The OLED refresh is slower than the 115200-baud status stream. A larger UART
; receive buffer prevents back-to-back status lines from overflowing while the
; display is being redrawn.
build_flags = -D SERIAL_RX_BUFFER_SIZE=256

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6
