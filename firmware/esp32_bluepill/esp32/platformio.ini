[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; The recording length is in seconds. The server must allow at least this
; duration; see server/.env (MAX_AUDIO_SECONDS). Override here if needed.
; build_flags = -D RECORD_SECONDS=30

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
